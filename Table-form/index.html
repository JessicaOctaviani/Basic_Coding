            <br>
            <div class="form">
                <h2>お問い合わせ</h2>
                <form>
                    <div>
                        <label for="namae">お名前 [必須]</label>
                        <input type="text" id="namae" name="お名前 [必須]">
                        <br>
                    </div>
                    <div>
                        <label for="MailAddress">メールアドレス [必須]</label>
                        <input type="text" id="MailAddress" name="メールアドレス [必須]">
                        <br>
                    </div>
                    <div>
                        <label for="PhoneNumber">電話番号[任意]</label>
                        <input type="text" id="PhoneNumber" name="電話番号[任意]">
                        <br>
                    </div>
                    <div>
                        <label for="requirement">ご用件 [必須]</label>
                        <select id="requirement" name="ご用件 [必須]">
                            <option value disable selected hidden>選択してください</option>
                            <option value="opsi1">書籍についてのご質問(個人のお客様)</option>
                            <option value="opsi2">書籍についてのご質問(取次・書店様)</option>
                            <option value="opsi3">書籍についてのご質問(メディア関係者様)</opion>
                            <option value="opsi4">アルバイト・パートに関するお問い合わせ</option>
                            <option value="opsi5">仕事のご依頼・お問い合わせ</option>
                            <option value="opsi6">外部スタッフのご希望(フリーの方、制作会社様)</option>
                            <option value="opsi7">その他のお問合せ</option>
                        </select><br>
                    </div>
                    <div>
                        <label for="Content">お問い合わせ内容 [必須]</label><br>
                        <textarea name="お問い合わせ内容 [必須]" rows="10px" cols="50px"></textarea><br><br>
                        
                    </div>
                    <button type="button">確認</button>
                </form>
            </div>
